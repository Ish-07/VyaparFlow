

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: vyaparflow-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: vyaparflow
      POSTGRES_PASSWORD: vyaparflow
      POSTGRES_DB: vyaparflow
    ports:
      - "5432:5432"
    volumes:
      - vyaparflow_pg_data:/var/lib/postgresql/data
      - ./init/01-extensions.sql:/docker-entrypoint-initdb.d/01-extensions.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vyaparflow"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: vyaparflow-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  vyaparflow_pg_data:
